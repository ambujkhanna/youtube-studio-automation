name: Weekly AInation Long Video

on:
  schedule:
    - cron: "30 4 * * 0"    # 04:30 UTC Sunday = 10:00 IST; publishes inside PUBLISH_WINDOW
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        default: "Next video (scheduled)"
        options:
          - "Next video (scheduled)"
          - "Next video, publish now"
          - "Dry run (render only, nothing uploaded)"
          - "Refresh thumbnails"
      post_to:
        description: "Where to post"
        type: choice
        default: "YouTube + Facebook"
        options:
          - "YouTube + Facebook"
          - "YouTube only"
          - "Facebook only"
      episode:
        description: "Episode id, e.g. ep014 or s-ollama (empty = next in line; with Refresh thumbnails = only that video)"
        required: false
      board_style:
        description: "Board look for THIS run (default = repo variable BOARD_STYLE, else hanging)"
        type: choice
        default: "default"
        options:
          - "default"
          - "hanging"
          - "display"
          - "whiteboard"

permissions:
  contents: write

concurrency:
  group: weekly-long
  cancel-in-progress: false

jobs:
  render-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.12
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Chatterbox voices (cached; if this fails the run uses the Kokoro voices)
        if: ${{ inputs.action != 'Refresh thumbnails' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/cbenv
            ~/.cache/huggingface
          key: chatterbox-v1-${{ runner.os }}

      - name: Install Chatterbox (CPU, first run only)
        if: ${{ inputs.action != 'Refresh thumbnails' }}
        timeout-minutes: 25
        continue-on-error: true
        run: |
          if ! ~/cbenv/bin/python -c "import chatterbox" 2>/dev/null; then
            rm -rf ~/cbenv && python3.11 -m venv ~/cbenv
            ~/cbenv/bin/pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
            ~/cbenv/bin/pip install -q chatterbox-tts
          fi
          ~/cbenv/bin/python -c "import chatterbox; print('chatterbox ready')"

      - name: System packages (ffmpeg with libass, Inter font)
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -q
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -q ffmpeg fonts-inter fonts-noto-color-emoji libegl1 libgl1 libfontconfig1

      - name: Python packages
        run: pip install -r pipeline/requirements.txt

      - name: Cache voice model files
        uses: actions/cache@v4
        with:
          path: |
            kokoro-q8.onnx
            voices.bin
            kokoro-dur.onnx
          key: kokoro-q8-v1

      - name: Prepare voice models
        run: python pipeline/setup_models.py

      - name: Render, QC, upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          PUBLISH_WINDOW: ${{ vars.PUBLISH_WINDOW || '17:00-20:00' }}
          TTS_ENGINE: ${{ vars.TTS_ENGINE || 'chatterbox' }}
          CB_PYTHON: /home/runner/cbenv/bin/python
          CB_TURBO_LAUGHS: ${{ vars.CB_TURBO_LAUGHS || '1' }}
          PYTHONUNBUFFERED: "1"
          ACTION: ${{ inputs.action }}
          POST_TO: ${{ inputs.post_to }}
          EPISODE_IN: ${{ inputs.episode }}
          KEEP_THUMBS: ${{ vars.KEEP_THUMBS || '2' }}
          YT_TIMEOUT: ${{ vars.YT_TIMEOUT || '300' }}
          INTRO: ${{ vars.INTRO || 'on' }}
          OUTRO: ${{ vars.OUTRO || 'on' }}
          BOARD_STYLE: ${{ vars.BOARD_STYLE || 'hanging' }}
          BOARD_STYLE_RUN: ${{ inputs.board_style || '' }}
        run: |
          ARGS=""
          case "$ACTION" in
            *"publish now"*) ARGS="--now" ;;
            "Dry run"*) ARGS="--dry-run" ;;
            "Refresh thumbnails") ARGS="--refresh-thumbnails" ;;
            "Post 1 old"*) ARGS="--social-backfill 1" ;;
            "Post 3 old"*) ARGS="--social-backfill 3" ;;
          esac
          if [ -n "$EPISODE_IN" ]; then
            if ! printf "%s" "$EPISODE_IN" | grep -Eq "^[A-Za-z0-9_-]+$"; then echo "episode must be an id like ep014"; exit 1; fi
            ARGS="$ARGS --episode $EPISODE_IN"
          fi
          case "$POST_TO" in ""|*YouTube*) ;; *) ARGS="$ARGS --social-only" ;; esac  # no YouTube: post to the chosen social platforms only
          python pipeline/daily.py --long $ARGS

      - name: Keep the video as a downloadable artifact (14 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-video-${{ github.run_number }}
          path: |
            out/*.mp4
            out/*_thumbnail.jpg
            out/*.jpg
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit run state
        if: always()
        env:
          STATE_BOT: aination-bot
        run: |
          python pipeline/save_state.py "Weekly long run: update state"
