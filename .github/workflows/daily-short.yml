name: Daily AInation Short

on:
  schedule:
    - cron: "15 9 * * *"     # 09:15 UTC = 14:45 IST; upload is scheduled inside the 17:00-20:00 IST window
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render + QC only (no upload)"
        type: boolean
        default: false
      episode:
        description: "Force an episode id (e.g. ep003); empty = next in backlog"
        required: false
      publish_now:
        description: "Publish immediately (no schedule)"
        type: boolean
        default: false
      social_only:
        description: "Only post the chosen episode (fill 'episode') to Facebook + Instagram - no YouTube upload"
        type: boolean
        default: false
      script:
        description: "Make a video from YOUR script: a file path (scripts/bees.txt) OR paste the whole script here (format: scripts/README.md)"
        required: false
      social_backfill:
        description: "Post videos already on YouTube to Facebook + Instagram (how many this run; 0 = off)"
        type: choice
        default: "0"
        options: ["0", "1", "2", "3", "4"]
      board_style:
        description: "Board look for THIS run (default = repo variable BOARD_STYLE, else hanging)"
        type: choice
        default: "default"
        options: ["default", "hanging", "display", "whiteboard"]
      refresh_thumbnails:
        description: "Only re-make and upload thumbnails for videos already uploaded (no new video)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  render-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.12
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Chatterbox voices (cached; if this fails the run uses the Kokoro voices)
        if: ${{ inputs.refresh_thumbnails != true }}
        uses: actions/cache@v4
        with:
          path: |
            ~/cbenv
            ~/.cache/huggingface
          key: chatterbox-v1-${{ runner.os }}

      - name: Install Chatterbox (CPU, first run only)
        if: ${{ inputs.refresh_thumbnails != true }}
        timeout-minutes: 25
        continue-on-error: true
        run: |
          if ! ~/cbenv/bin/python -c "import chatterbox" 2>/dev/null; then
            rm -rf ~/cbenv && python3.11 -m venv ~/cbenv
            ~/cbenv/bin/pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
            ~/cbenv/bin/pip install -q chatterbox-tts
          fi
          ~/cbenv/bin/python -c "import chatterbox; print('chatterbox ready')"

      - name: System packages (ffmpeg with libass, Inter font)
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -q
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -q ffmpeg fonts-inter fonts-noto-color-emoji libegl1 libgl1 libfontconfig1

      - name: Python packages
        run: pip install -r pipeline/requirements.txt

      - name: Cache voice model files
        uses: actions/cache@v4
        with:
          path: |
            kokoro-q8.onnx
            voices.bin
            kokoro-dur.onnx
          key: kokoro-q8-v1

      - name: Prepare voice models
        run: python pipeline/setup_models.py

      - name: Render, QC, upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          PUBLISH_WINDOW: ${{ vars.PUBLISH_WINDOW || '17:00-20:00' }}
          TTS_ENGINE: ${{ vars.TTS_ENGINE || 'chatterbox' }}
          CB_PYTHON: /home/runner/cbenv/bin/python
          CB_TURBO_LAUGHS: ${{ vars.CB_TURBO_LAUGHS || '1' }}
          PYTHONUNBUFFERED: "1"
          KEEP_THUMBS: ${{ vars.KEEP_THUMBS || '2' }}
          YT_TIMEOUT: ${{ vars.YT_TIMEOUT || '300' }}
          INTRO: ${{ vars.INTRO || 'on' }}
          OUTRO: ${{ vars.OUTRO || 'on' }}
          SCRIPT_IN: ${{ inputs.script }}
          BOARD_STYLE: ${{ vars.BOARD_STYLE || 'hanging' }}
          BOARD_STYLE_RUN: ${{ inputs.board_style || '' }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.episode }}" ]; then ARGS="$ARGS --episode ${{ inputs.episode }}"; fi
          if [ "${{ inputs.publish_now }}" = "true" ]; then ARGS="$ARGS --now"; fi
          if [ "${{ inputs.refresh_thumbnails }}" = "true" ]; then ARGS="$ARGS --refresh-thumbnails"; fi
          if [ "${{ inputs.social_only }}" = "true" ]; then ARGS="$ARGS --social-only"; fi
          if [ -n "${{ inputs.social_backfill }}" ] && [ "${{ inputs.social_backfill }}" != "0" ]; then ARGS="$ARGS --social-backfill ${{ inputs.social_backfill }}"; fi
          python pipeline/daily.py $ARGS

      - name: Keep the video as a downloadable artifact (14 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-short-${{ github.run_number }}
          path: |
            out/*.mp4
            out/*_thumbnail.jpg
            out/*.jpg
            out/*.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit run state
        if: always()
        env:
          STATE_BOT: aination-bot
        run: |
          python pipeline/save_state.py "Daily run: update episode state"
