name: Daily AInation Short

on:
  schedule:
    - cron: "23 9 * * *"     # 09:15 UTC = 14:45 IST; upload is scheduled inside the 17:00-20:00 IST window
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        default: "Next video (scheduled)"
        options:
          - "Next video (scheduled)"
          - "Next video, publish now"
          - "Dry run (render only, nothing uploaded)"
          - "Refresh thumbnails"
          - "Post 1 old video to Facebook + Instagram"
          - "Post 3 old videos to Facebook + Instagram"
      post_to:
        description: "Where to post"
        type: choice
        default: "YouTube + Facebook + Instagram"
        options:
          - "YouTube + Facebook + Instagram"
          - "YouTube only"
          - "Facebook + Instagram only"
          - "YouTube + Facebook"
          - "YouTube + Instagram"
          - "Facebook only"
          - "Instagram only"
      episode:
        description: "Episode id, e.g. ep014 or s-ollama (empty = next in line; with Refresh thumbnails = only that video)"
        required: false
      script:
        description: "Make a video from YOUR script: a file path (scripts/bees.txt) OR paste the whole script (format: scripts/README.md)"
        required: false
      board_style:
        description: "Board look for THIS run (default = repo variable BOARD_STYLE, else hanging)"
        type: choice
        default: "default"
        options:
          - "default"
          - "hanging"
          - "display"
          - "whiteboard"

permissions:
  contents: write
  actions: read

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  render-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.12
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Chatterbox voices (cached; if this fails the run uses the Kokoro voices)
        if: ${{ inputs.action != 'Refresh thumbnails' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/cbenv
            ~/.cache/huggingface
          key: chatterbox-v1-${{ runner.os }}

      - name: Install Chatterbox (CPU, first run only)
        if: ${{ inputs.action != 'Refresh thumbnails' }}
        timeout-minutes: 25
        continue-on-error: true
        run: |
          if ! ~/cbenv/bin/python -c "import chatterbox" 2>/dev/null; then
            rm -rf ~/cbenv && python3.11 -m venv ~/cbenv
            ~/cbenv/bin/pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
            ~/cbenv/bin/pip install -q chatterbox-tts
          fi
          ~/cbenv/bin/python -c "import chatterbox; print('chatterbox ready')"

      - name: System packages (install only what is missing; retry transient apt failures)
        timeout-minutes: 25
        run: |
          set -euo pipefail
          packages=(ffmpeg fonts-inter fonts-noto-color-emoji libegl1 libgl1 libfontconfig1)
          missing=()
          for package in "${packages[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q "install ok installed"; then
              missing+=("$package")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "All required system packages are already installed on the GitHub runner."
            ffmpeg -version | head -n 1
            exit 0
          fi

          echo "Missing packages: ${missing[*]}"
          updated=0
          for attempt in 1 2 3; do
            echo "apt-get update attempt $attempt/3"
            if timeout 7m sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=120 update -q; then
              updated=1
              break
            fi
            sleep $((attempt * 10))
          done
          if [ "$updated" -ne 1 ]; then
            echo "::error::apt-get update failed after 3 bounded attempts."
            exit 1
          fi

          installed=0
          for attempt in 1 2 3; do
            echo "apt-get install attempt $attempt/3"
            if timeout 7m sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=120 install -y -q "${missing[@]}"; then
              installed=1
              break
            fi
            sleep $((attempt * 10))
          done
          if [ "$installed" -ne 1 ]; then
            echo "::error::Required system packages could not be installed after 3 bounded attempts."
            exit 1
          fi
          ffmpeg -version | head -n 1

      - name: Python packages
        run: pip install -r pipeline/requirements.txt

      - name: Install self-check (optional; never blocks a run)
        continue-on-error: true
        run: pip install -q faster-whisper

      - name: Cache voice model files
        uses: actions/cache@v4
        with:
          path: |
            kokoro-q8.onnx
            voices.bin
            kokoro-dur.onnx
          key: kokoro-q8-v1

      - name: Prepare voice models
        run: python pipeline/setup_models.py

      - name: Load latest analytics growth brief (read-only)
        continue-on-error: true  # optional: a GitHub API hiccup here must never stop the video run
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/analytics
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow youtube-analytics.yml --json databaseId,status,conclusion --jq '[.[] | select(.status == "completed" and .conclusion == "success")] | .[0].databaseId // empty')"
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir out/analytics || true
          fi

          # gh run download creates an artifact-named subdirectory. Find the
          # generated brief there, then copy its companion JSON into a stable path.
          BRIEF_PATH="$(find out/analytics -type f -name growth_brief.md -print -quit)"
          if [ -n "$BRIEF_PATH" ]; then
            BRIEF_DIR="$(dirname "$BRIEF_PATH")"
            cp "$BRIEF_PATH" out/analytics/growth_brief.md
            if [ -f "$BRIEF_DIR/growth_brief.json" ]; then
              cp "$BRIEF_DIR/growth_brief.json" out/analytics/growth_brief.json
            fi
            echo "### Analytics-led content guidance" >> "$GITHUB_STEP_SUMMARY"
            cat out/analytics/growth_brief.md >> "$GITHUB_STEP_SUMMARY"
            echo "Growth brief loaded for editorial review; existing episode content and publishing settings are unchanged."
          else
            echo "::notice::No growth brief found in the latest successful analytics artifact; continuing with the existing episode workflow."
          fi

      - name: Render, QC, upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          PUBLISH_WINDOW: ${{ vars.PUBLISH_WINDOW || '17:00-20:00' }}
          TTS_ENGINE: ${{ vars.TTS_ENGINE || 'chatterbox' }}
          CB_PYTHON: /home/runner/cbenv/bin/python
          CB_TURBO_LAUGHS: ${{ vars.CB_TURBO_LAUGHS || '1' }}
          PYTHONUNBUFFERED: "1"
          ACTION: ${{ inputs.action }}
          POST_TO: ${{ inputs.post_to }}
          EPISODE_IN: ${{ inputs.episode }}
          KEEP_THUMBS: ${{ vars.KEEP_THUMBS || '2' }}
          YT_TIMEOUT: ${{ vars.YT_TIMEOUT || '300' }}
          INTRO: ${{ vars.SHORT_INTRO || 'off' }}  # Shorts start straight with the content (owner, 2026-11-22); on = intro WITH the topic
          CHAR_STYLE: ${{ vars.CHAR_STYLE || 'doodle' }}
          THUMB_STYLE: ${{ vars.THUMB_STYLE || 'punch' }}
          THUMB_MARK: ${{ vars.THUMB_MARK || 'sticker' }}
          OUTRO: ${{ vars.SHORT_OUTRO || vars.OUTRO || 'on' }}
          SCRIPT_IN: ${{ inputs.script }}
          BOARD_STYLE: ${{ vars.BOARD_STYLE || 'hanging' }}
          THEME: ${{ vars.THEME || 'studio_open' }}
          ICON_STYLE: ${{ vars.ICON_STYLE || 'house' }}
          STOCK: ${{ vars.STOCK || 'on' }}
          SELFCHECK: ${{ vars.SELFCHECK || 'on' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STOCK_STYLE: ${{ vars.STOCK_STYLE || 'plain' }}
          LIST_STYLE: ${{ vars.LIST_STYLE || 'tiles' }}
          CTA_STYLE: ${{ vars.CTA_STYLE || 'pop' }}
          BOARD_STYLE_RUN: ${{ inputs.board_style || '' }}
        run: |
          ARGS=""
          case "$ACTION" in
            *"publish now"*) ARGS="--now" ;;
            "Dry run"*) ARGS="--dry-run" ;;
            "Refresh thumbnails") ARGS="--refresh-thumbnails" ;;
            "Post 1 old"*) ARGS="--social-backfill 1" ;;
            "Post 3 old"*) ARGS="--social-backfill 3" ;;
          esac
          if [ -n "$EPISODE_IN" ]; then
            if ! printf "%s" "$EPISODE_IN" | grep -Eq "^[A-Za-z0-9_-]+$"; then echo "episode must be an id like ep014"; exit 1; fi
            ARGS="$ARGS --episode $EPISODE_IN"
          fi
          case "$POST_TO" in ""|*YouTube*) ;; *) ARGS="$ARGS --social-only" ;; esac  # no YouTube: post to the chosen social platforms only
          python pipeline/daily.py $ARGS

      - name: Keep the video as a downloadable artifact (14 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-short-${{ github.run_number }}
          path: |
            out/*.mp4
            out/*_thumbnail.jpg
            out/*.jpg
            out/*.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit run state
        if: always()
        env:
          STATE_BOT: aination-bot
        run: |
          python pipeline/save_state.py "Daily run: update episode state"

      - name: Alert on failure (only if alert secrets are set)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python pipeline/notify.py "❌ ${{ github.workflow }} failed in ${{ github.repository }} - $RUN_URL"
